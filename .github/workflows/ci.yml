name: CI

# Runs on every push and pull request: static analysis, the full test suite
# (parser fixtures, database, provider, widgets) and a debug APK build so
# native Android changes (widget, WorkManager, manifest) are compiled too.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # No google-services.json or signing secrets here: the build is set up
      # to work without them (push reminders off, debug signing).
      - name: Build debug APK
        run: flutter build apk --debug
